<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ganti Password - Piket Kelas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/ganti-password.js"></script>
</head>
<body>
  <main class="app">

    <div class="bar-kembali">
      <!-- Tautan kembali: alamatnya diperbarui js/ganti-password.js sesuai peran. Ikon dipasang oleh JS. -->
      <a class="tombol-ikon" id="tombol-kembali" href="index.html" aria-label="Kembali"></a>
    </div>

    <div class="login-isi">
      <h1 class="judul-besar">Ganti Password</h1>

      <form class="kartu" id="form-password" novalidate>
        <div class="isian">
          <label class="label" for="password-lama">Password lama</label>
          <div class="input-wadah">
            <input class="input input-dengan-ikon" id="password-lama" name="lama" type="password"
                   autocomplete="current-password">
            <button class="tombol-mata" id="mata-lama" type="button"></button>
          </div>
        </div>

        <div class="isian">
          <label class="label" for="password-baru">Password baru</label>
          <div class="input-wadah">
            <input class="input input-dengan-ikon" id="password-baru" name="baru" type="password"
                   autocomplete="new-password">
            <button class="tombol-mata" id="mata-baru" type="button"></button>
          </div>
        </div>

        <div class="isian">
          <label class="label" for="password-konfirmasi">Konfirmasi password baru</label>
          <div class="input-wadah">
            <input class="input input-dengan-ikon" id="password-konfirmasi" name="konfirmasi" type="password"
                   autocomplete="new-password">
            <button class="tombol-mata" id="mata-konfirmasi" type="button"></button>
          </div>
        </div>

        <button class="tombol tombol-utama tombol-penuh" id="tombol-simpan" type="submit">Simpan Password</button>
        <p class="pesan-error" id="pesan-error" role="alert" hidden></p>
        <p class="pesan-sukses" id="pesan-sukses" role="status" hidden></p>
      </form>
    </div>

  </main>
</body>
</html>
