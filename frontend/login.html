<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Masuk - Piket Kelas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/login.js"></script>
</head>
<body>
  <main class="app">
    <div class="login-isi">
      <h1 class="judul-besar">Piket Kelas</h1>

      <form class="kartu" id="form-login">
        <div class="isian">
          <label class="label" for="username">Username</label>
          <input class="input" id="username" name="username" type="text"
                 autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>

        <div class="isian">
          <label class="label" for="password">Password</label>
          <div class="input-wadah">
            <input class="input input-dengan-ikon" id="password" name="password" type="password"
                   autocomplete="current-password" required>
            <!-- Ikon dan aria-label diisi oleh js/login.js -->
            <button class="tombol-mata" id="tombol-mata" type="button"></button>
          </div>
        </div>

        <button class="tombol tombol-utama tombol-penuh" id="tombol-masuk" type="submit">Masuk</button>
        <p class="pesan-error" id="pesan-error" role="alert" hidden></p>
      </form>

      <p class="catatan-kecil">Lupa password? Hubungi pengembang kelas.</p>
    </div>
  </main>
</body>
</html>
